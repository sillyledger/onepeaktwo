<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Peak Two</title>
<meta name="description" content="A quiet branch for shows and writing. Podcasts, video and essays.">
<meta name="theme-color" content="#0b0c0b">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

  :root{
    --bg: #0b0c0b;
    --ink: #d8d6ce;
    --muted: #8e9188;
    --dim: #26281f;
    --signal: #8ba07f;
    --signal-soft: rgba(139, 160, 127, 0.35);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero{
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    overflow: hidden;
  }

  canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .content{
    position: absolute;
    left: 7vw;
    bottom: 16vh;
    max-width: none;
    z-index: 3;
    pointer-events: none;
  }

  h1{
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(3rem, 6.4vw, 6.25rem);
    font-weight: 500;
    letter-spacing: -0.045em;
    color: var(--ink);
    line-height: 1;
  }

  .desc{
    margin: 32px 0 0 0;
    font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(20px, 1.75vw, 27px);
    line-height: 1.55;
    color: var(--muted);
    max-width: 560px;
  }

  .contact{
    position: absolute;
    right: 7vw;
    bottom: 16vh;
    z-index: 3;
    font-weight: 400;
    font-size: clamp(18px, 1.45vw, 22px);
    line-height: 1.55;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: rgba(139, 160, 127, 0.45);
    text-decoration-thickness: 1px;
    text-underline-offset: 7px;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .contact:hover{ color: var(--signal); text-decoration-color: var(--signal); }
  .contact:focus-visible{ outline: 1px solid var(--signal); outline-offset: 6px; }
  .legal{
    position: absolute;
    left: 7vw;
    right: 7vw;
    bottom: 24px;
    z-index: 3;
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }
  .legal a{
    color: inherit;
    text-decoration: underline;
    text-decoration-color: rgba(142, 145, 136, 0.4);
    text-underline-offset: 4px;
  }
  .legal a:hover{ color: var(--ink); }

  @media (max-width: 640px){
    .content{ left: 6vw; right: 6vw; bottom: 19vh; max-width: none; }
    .contact{ left: 6vw; right: auto; bottom: 11vh; }
    .legal{ left: 6vw; right: 6vw; bottom: 20px; }
  }
</style>
</head>
<body>

<section class="hero">
  <canvas id="field"></canvas>

  <div class="content">
    <h1>one peak two</h1>
    <p class="desc">
      A quiet branch for shows and writing. Podcasts, video and essays.
    </p>
  </div>

  <a class="contact" href="mailto:media@onepeaktwo.com">media@onepeaktwo.com</a>

  <p class="legal">© <span id="year">2026</span> One Peak Two. Part of <a href="https://ryokagroup.com">Ryoka Group</a>.</p>
</section>

<script>
(function(){
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, dpr, points = [];
  const peakCenterFrac = 0.56;

  const colors = {
    dim: '#26281f',
    signal: '#8ba07f'
  };

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seedPoints();
  }

  function seedPoints(){
    const count = W < 640 ? 140 : 320;
    points = [];
    for (let i = 0; i < count; i++){
      points.push({
        x: Math.random() * W,
        y: H * 0.18 + Math.random() * H * 0.62,
        r: Math.random() * 1.1 + 0.3,
        a: Math.random() * 0.35 + 0.05
      });
    }
  }

  // waveform: gentle noise + three bumps — one tall peak flanked by two lesser ones
  function waveY(x){
    const base = H * 0.56;
    const w = W;
    const noise =
      Math.sin(x * 0.014) * 4 +
      Math.sin(x * 0.037 + 1.3) * 2.4 +
      Math.sin(x * 0.081 + 0.4) * 1.1;

    const bump = (center, width, height) => {
      const d = (x - center) / width;
      return height * Math.exp(-d * d);
    };

    const b1 = bump(w * 0.24, w * 0.055, -34);
    const peak = bump(w * peakCenterFrac, w * 0.05, -92);
    const b2 = bump(w * 0.82, w * 0.06, -30);

    return base + noise + b1 + peak + b2;
  }

  function drawDots(){
    ctx.clearRect(0, 0, W, H);
    for (const p of points){
      ctx.beginPath();
      ctx.fillStyle = colors.dim;
      ctx.globalAlpha = p.a;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawWave(progressPx){
    ctx.beginPath();
    ctx.strokeStyle = colors.signal;
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';

    const step = 4;
    let started = false;
    for (let x = 0; x <= progressPx; x += step){
      const y = waveY(x);
      if (!started){ ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    if (progressPx > 2){
      ctx.lineTo(progressPx, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, H * 0.3, 0, H);
      grad.addColorStop(0, 'rgba(139,160,127,0.10)');
      grad.addColorStop(1, 'rgba(139,160,127,0)');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    if (progressPx > 0 && progressPx < W){
      const y = waveY(progressPx);
      ctx.beginPath();
      ctx.fillStyle = colors.signal;
      ctx.shadowColor = colors.signal;
      ctx.shadowBlur = 10;
      ctx.arc(progressPx, y, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function frame(t){
    drawDots();
    if (reduceMotion){
      drawWave(W);
    } else {
      const cycle = 9000;
      const progress = (t % cycle) / cycle;
      drawWave(progress * W);
      requestAnimationFrame(frame);
    }
  }

  window.addEventListener('resize', resize);
  resize();

  if (reduceMotion){
    drawDots();
    drawWave(W);
  } else {
    requestAnimationFrame(frame);
  }

  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>

</body>
</html>
